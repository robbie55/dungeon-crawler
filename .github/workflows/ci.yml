name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  build-matrix:
    name: Build Matrix
    strategy:
      fail-fast: false # makes for easier debugging across builds
      matrix:
        os: [macos-14, windows-latest]
        preset: [debug, release]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache raylib build
        uses: actions/cache@v5
        with:
          path: build/${{ matrix.preset }}/_deps
          key: ${{ runner.os }}-raylib-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build build/${{ matrix.preset }}


      # - name: Smoketest (run binary)
      #
      #   run: ./build/${{ matrix.preset }}/debugger

      # - name: Run Tests
      #
      #   run: ctest --preset ${{ matrix.preset }}


  lint:
    name: Linter (Ubuntu v.24.04)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clang Format
        run: git ls-files -z '*.cpp' '*.h' '*.hpp' | xargs -0 clang-format --dry-run --Werror
